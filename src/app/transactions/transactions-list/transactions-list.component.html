<mat-card>
    <mat-card-title class="tbl__header--bg">Transactions</mat-card-title>
    <mat-table [dataSource]="transactions" class="mat-elevation-z8 tbl-width">
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let t">{{ t.date }}</td>
        </ng-container>
        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let t">{{ t.type }}</td>
        </ng-container>
        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef="amount">Amount</th>
            <td mat-cell *matCellDef="let t">
                <span [ngClass]="t.type === 'CREDIT' ? 'credit': 'debit'">
                    {{ t.amount | currency }}
                </span>
            </td>
        </ng-container>
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef="description">Description</th>
            <td mat-cell *matCellDef="let t">{{ t.description }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
    </mat-table>
</mat-card>
