<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form-decor">
    <mat-form-field appearance="fill" class="form-decor__field-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-decor__field-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password">
    </mat-form-field>
    <button mat-raised-button color="primary" class="form-decor__field-width">Register</button>
</form>
