<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-decor">
    <mat-form-field appearance="fill" class="form-decor__field-width">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Email" formControlName="email">
    </mat-form-field>
    <mat-form-field appearance="fill" class="form-decor__field-width">
        <mat-label>Password</mat-label>
        <input matInput placeholder="password" formControlName="password">
    </mat-form-field>
    <button mat-raised-button color="primary" class="form-decor__field-width">Login</button>
</form>
@if (error) {
<div class="err-modal">{{ error }}</div>
}
